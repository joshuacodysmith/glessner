id: amcacheparser
name: AmcacheParser
publisher: Eric Zimmerman
license: MIT
download_url: https://download.ericzimmermanstools.com/net/AmcacheParser.zip
detect:
  executables: [AmcacheParser.exe]
  version: {args: ["--version"], regex: '^(\d+\.\d+\.\d+)'}
# The .NET 10 build, on a .NET 10 runtime, ideally one unpacked in the tools folder.
dotnet: 10
handles: ["registry:AMCACHE"]   # only the Amcache.hve hive, not every registry file
input: each_file
# AmcacheParser replays a dirty hive's transaction logs when they sit beside it, so the newest entries are read. --nl
# skips them, and lets it process a dirty hive whose logs were not collected, where it would otherwise stop. So the
# runner adds --nl only when the hive has no transaction log beside it.
without_related:
  - {artifact: registry_log, args: ["--nl"]}
run:
  # -i adds the file entries linked to programs.
  args: ["-f", "{input_file}", "-i", "--csv", "{output_dir}"]
  timeout_minutes: 15
options: []
outputs: ["*_Amcache_ProgramEntries.csv"]
parser: amcache_csv
notes: "Amcache: programs and executable files Windows saw, with SHA-1 values"
