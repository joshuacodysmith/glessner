id: lecmd
name: LECmd
publisher: Eric Zimmerman
license: MIT
download_url: https://download.ericzimmermanstools.com/LECmd.zip
detect:
  executables: [LECmd.exe]
  version: {args: ["--version"], regex: '^(\d+\.\d+\.\d+)'}
handles: [lnk]
input: host_dir
# LECmd reads only files named *.lnk in the folder it is given, while intake identifies a file by its signature,
# so a renamed one is an input the tool never opens. The runner notes the files a run leaves out.
selects: ["*.lnk"]
run:
  args: ["-d", "{host_dir}", "-q", "--csv", "{output_dir}", "--csvf", "lecmd.csv"]
  timeout_minutes: 30
options: []
outputs: [lecmd.csv]
parser: lecmd_csv
notes: The Source* times describe the collected copy of the LNK file, not the original, so the parser ignores them.
