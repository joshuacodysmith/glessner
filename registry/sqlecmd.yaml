id: sqlecmd
name: SQLECmd
publisher: Eric Zimmerman
license: MIT
download_url: https://download.ericzimmermanstools.com/net/SQLECmd.zip
detect:
  executables: [SQLECmd.exe]
  version: {args: ["--version"], regex: '^(\d+\.\d+\.\d+)'}
# Browser history, downloads, searches, and typed URLs (Chrome, Edge, Brave, Firefox), and Windows notifications, by
# the maps in the tool's Maps folder. The .NET 10 build; .NET 10 from the tools folder.
# SQLite may write beside a database it opens, so it runs on copies, with each database's log files. --hunt false: a
# map applies to the database file it names, rather than to every SQLite file.
dotnet: 10
handles: [sqlite]
input: host_dir
work_on_copies: true
copy_also: [sqlite_log]
run_in_run_folder: true
run:
  args: ["-d", "{host_dir}", "--csv", "{output_dir}", "--hunt", "false"]
  timeout_minutes: 30
options: []
outputs: ["*.csv"]
# The database maps it reads from its Maps folder, and the native SQLite library that parses the databases, which the
# 2026.10 build loads from runtimes\<platform>\native in its own folder: a run and a pin record their SHA-256, and the
# set is named by its count of maps. Builds before 2026.10 have no runtimes folder; they hold that code in SQLECmd.dll,
# which is hashed, and unpack SQLite.Interop.dll into their working folder, so the tool starts in the run's folder.
tool_files: [Maps, runtimes]
rules_label: {kind: count, path: 'Maps\*.smap', text: "Maps, {value} maps"}
empty_result: "SQLECmd's maps matched none of the host's SQLite databases."
empty_ok: true
parser: sqlecmd_csv
notes: "Browser history, downloads, searches, and typed URLs, and Windows notifications"
